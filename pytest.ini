# ─────────────────────────────────────────────
#  TalentMind AI  ─  Pytest Configuration
# ─────────────────────────────────────────────

[pytest]
# Test discovery
testpaths     = tests
python_files  = test_*.py
python_classes= Test*
python_functions = test_*

# Output format
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings

# Asyncio mode
asyncio_mode = auto

# Custom markers
markers =
    unit       : Unit tests
    integration: Integration tests
    slow       : Slow running tests
    agent      : Agent tests