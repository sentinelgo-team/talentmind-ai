# ─────────────────────────────────────────────
#  TalentMind AI  ─  Docker Compose
#  Production-ready container orchestration
# ─────────────────────────────────────────────

version: '3.9'

services:

  # ── Main Application ──────────────────────
  talentmind:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: talentmind-ai
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - talentmind-data:/app/data
      - talentmind-logs:/app/logs
    networks:
      - talentmind-network
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; \
              urllib.request.urlopen('http://localhost:8501')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  talentmind-data:
    driver: local
  talentmind-logs:
    driver: local

networks:
  talentmind-network:
    driver: bridge